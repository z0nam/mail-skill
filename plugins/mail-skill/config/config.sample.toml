# Himalaya 2.x config 템플릿 — mail-skill (#30: 1.x 형식은 2.x 가 읽지 않는다)
#
# 실제 설정은 이 파일을 참고해 ~/.config/himalaya/config.toml 에 만든다
#   (회사메일 웍스는 `mailskill setup` 이 config/works.template.toml 로 만들어 준다).
# 주의: 2.x 는 OS 설정 폴더(맥 ~/Library/Application Support/himalaya, Windows %APPDATA%\himalaya)를
#   ~/.config/himalaya 보다 먼저 찾는다. 앞쪽에 파일이 있으면 그것이 이긴다.
# 주의: -c / HIMALAYA_CONFIG 는 ':' 로 여러 경로를 받는다 — Windows 드라이브 경로(C:\...)는 쪼개지므로
#   Windows 에서는 기본 위치에 두고 -c 를 쓰지 않는다.
# 시크릿은 평문 금지: password.command = "mail-secret <name>" 로 age 암호화 파일에서 읽는다
#   (Unix 는 /bin/sh -c, Windows 는 cmd /C 로 실행 — PATH 의 mail-secret / mail-secret.cmd).
#   1) 비번 등록:  scripts/secret-set <name>   (또는  ... | scripts/secret-set <name> --stdin)
#   2) password.command 의 <name> 을 등록한 키와 일치.
# 일부 제공사(WorksMobile/Naver 등)는 IMAP/SMTP 앱비번이 따로일 수 있음 → 키 2개로 분리.
# 보낸함 사본: 2.x 는 message.send.save-copy 를 설정해야 사본을 저장한다(1.x 는 기본 저장).
#   서버가 보낸 메일을 자동 저장하지 않는 공급자만 message.send.save-copy = "sent" 와
#   mailbox.alias.sent = "<실제 보낸함 이름>" 을 함께 켠다(IMAP 은 sent 역할을 모른다).
#   서버가 스스로 저장하는 곳(Gmail·웍스 등)은 켜면 사본이 2통이 된다 — 켜지 않는다.

[accounts.example-gmail]
default = true
email = "you@example.com"
display-name = "You (Gmail)"
mailbox.alias.sent = "[Gmail]/Sent Mail"

imap.server = "imaps://imap.gmail.com:993"
imap.sasl.plain.username = "you@example.com"
imap.sasl.plain.password.command = "mail-secret himalaya-example-gmail"

smtp.server = "smtps://smtp.gmail.com:465"
smtp.sasl.plain.username = "you@example.com"
smtp.sasl.plain.password.command = "mail-secret himalaya-example-gmail"

# 로컬 변환 아카이브(읽기 전용, 비번 불필요) — Maildir 백엔드 예시:
# [accounts.archive]
# email = "you@example.com"
# maildir.root = "/path/to/archive/Maildir"

# ── 제공사 호스트 프리셋 (imap.server / smtp.server) ─────────────────────
#   imaps:// = 993 암묵 TLS · smtps:// = 465 암묵 TLS · smtp://…:587 + smtp.starttls = true
#   Gmail/Workspace : imaps://imap.gmail.com:993 / smtps://smtp.gmail.com:465  (앱비번 필요, 2FA)
#   Naver           : imaps://imap.naver.com:993 / smtp://smtp.naver.com:587 + starttls  (IMAP 켜기+앱비번)
#   Kakao(Daum)     : imaps://imap.kakao.com:993 / smtps://smtp.kakao.com:465
#   iCloud          : imaps://imap.mail.me.com:993 / smtp://smtp.mail.me.com:587 + starttls  (앱전용 암호)
#   WorksMobile     : imaps://imap.worksmobile.com:993 / smtp://smtp.worksmobile.com:587 + starttls

# Himalaya 계정 템플릿 — NAVER WORKS(웍스모바일) 회사메일.
# `mailskill setup` 이 __이름__ 자리를 채워 사용자 PC 에만 config.toml 을 만든다.
# 채운 결과(개인 이메일·로그인)는 로컬 전용 — 저장소에 커밋하지 않는다.
# 비밀번호는 여기 없다: auth.cmd 가 age 암호화 파일에서 꺼낸다(mail-secret).
# 웍스는 IMAP·SMTP 가 같은 앱 비밀번호를 쓰지만, 이름은 둘로 나눠 둔다(제공사 차이 흡수).

[accounts.__ACCOUNT__]
default = true
email = "__EMAIL__"
display-name = "__DISPLAY_NAME__"

backend.type = "imap"
backend.host = "imap.worksmobile.com"
backend.port = 993
backend.encryption.type = "tls"
backend.login = "__LOGIN__"
backend.auth.type = "password"
backend.auth.cmd = "mail-secret himalaya-__ACCOUNT__-imap"

message.send.backend.type = "smtp"
message.send.backend.host = "smtp.worksmobile.com"
message.send.backend.port = 587
message.send.backend.encryption.type = "start-tls"
message.send.backend.login = "__LOGIN__"
message.send.backend.auth.type = "password"
message.send.backend.auth.cmd = "mail-secret himalaya-__ACCOUNT__-smtp"
